<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#F3F5DC"/>
      <stop offset="0.6" stop-color="#E4E9C2"/>
      <stop offset="1" stop-color="#CDD6A6"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EEB0"/>
      <stop offset="1" stop-color="#E4E6DE"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="-300" y1="-300" x2="300" y2="300">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="0.18" stop-color="#F2CF6B"/>
      <stop offset="0.4" stop-color="#B8862B"/>
      <stop offset="0.55" stop-color="#F6DA85"/>
      <stop offset="0.75" stop-color="#C4922F"/>
      <stop offset="1" stop-color="#7A5512"/>
    </linearGradient>
    <linearGradient id="goldEdge" gradientUnits="userSpaceOnUse" x1="300" y1="300" x2="-300" y2="-300">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.5" stop-color="#B07E22"/>
      <stop offset="1" stop-color="#6E4A0E"/>
    </linearGradient>
    <radialGradient id="enamel" gradientUnits="userSpaceOnUse" cx="-80" cy="-100" r="380">
      <stop offset="0" stop-color="#3E6150"/>
      <stop offset="1" stop-color="#2A4636"/>
    </radialGradient>
    <linearGradient id="enamelLight" gradientUnits="userSpaceOnUse" x1="-110" y1="-110" x2="110" y2="110">
      <stop offset="0" stop-color="#E6EDA2"/>
      <stop offset="1" stop-color="#CBD67C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3b4a2a" flood-opacity="0.25"/>
    </filter>
    <filter id="inset" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="3" dy="5"/>
      <feGaussianBlur stdDeviation="5" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="out" result="inner"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="inner" operator="in" result="sh"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0.08 0"/>
    </filter>

    <!-- 8-lobed flower: lobes of radius R at distance D -->
    <g id="flowerBig"><circle r="205"/><circle cx="0.0" cy="-195.0" r="108"/><circle cx="137.9" cy="-137.9" r="108"/><circle cx="195.0" cy="0.0" r="108"/><circle cx="137.9" cy="137.9" r="108"/><circle cx="0.0" cy="195.0" r="108"/><circle cx="-137.9" cy="137.9" r="108"/><circle cx="-195.0" cy="0.0" r="108"/><circle cx="-137.9" cy="-137.9" r="108"/></g>
    <g id="flowerInner"><circle r="185"/><circle cx="0.0" cy="-195.0" r="86"/><circle cx="137.9" cy="-137.9" r="86"/><circle cx="195.0" cy="0.0" r="86"/><circle cx="137.9" cy="137.9" r="86"/><circle cx="0.0" cy="195.0" r="86"/><circle cx="-137.9" cy="137.9" r="86"/><circle cx="-195.0" cy="0.0" r="86"/><circle cx="-137.9" cy="-137.9" r="86"/></g>
    <path id="star" d="M0,-120 Q14,-14 120,0 Q14,14 0,120 Q-14,14 -120,0 Q-14,-14 0,-120Z"/>
    <clipPath id="innerClip"><use href="#flowerInner"/></clipPath>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" filter="url(#grain)"/>

  <!-- backing card -->
  <g filter="url(#cardShadow)">
    <rect x="260" y="120" width="680" height="960" rx="36" fill="url(#card)"/>
  </g>
  <circle cx="600" cy="175" r="22" fill="#CDD6A6"/>
  <circle cx="600" cy="175" r="22" fill="none" stroke="#B7C08E" stroke-width="2"/>
  <text x="600" y="290" text-anchor="middle" font-family="'Montserrat','Poppins','DejaVu Sans',sans-serif" font-weight="700" font-size="64" letter-spacing="6" fill="#1F3D2E">MOKYOKAI</text>
  <text x="600" y="1010" text-anchor="middle" font-family="'DejaVu Sans',sans-serif" font-weight="700" font-size="26" letter-spacing="8" fill="#33523F" opacity="0.8">ENAMEL PIN</text>

  <g transform="translate(600 660) rotate(-6) scale(0.8)">
    <!-- drop shadow -->
    <g transform="translate(16 26)" fill="#2b3a1d" opacity="0.4" filter="url(#shadow)"><use href="#flowerBig"/></g>
    <!-- gold metal body: edge + face -->
    <g transform="translate(3 5)" fill="url(#goldEdge)"><use href="#flowerBig"/></g>
    <g fill="url(#gold)"><use href="#flowerBig"/></g>
    <!-- recessed green enamel -->
    <g filter="url(#inset)" fill="url(#enamel)"><use href="#flowerInner"/></g>
    <!-- gold star line + light enamel -->
    <g transform="rotate(14) scale(1.05)">
      <use href="#star" transform="scale(1.22)" fill="url(#gold)"/>
      <use href="#star" fill="url(#enamelLight)" filter="url(#inset)"/>
    </g>
    <!-- gloss over enamel -->
    <g clip-path="url(#innerClip)">
      <ellipse cx="-90" cy="-170" rx="300" ry="170" fill="url(#gloss)" transform="rotate(-20)"/>
    </g>
    <!-- specular sparks on metal -->
    <ellipse cx="-205" cy="-205" rx="30" ry="6" fill="#fff" opacity="0.85" transform="rotate(-45 -205 -205)"/>
    <ellipse cx="-45" cy="-296" rx="22" ry="5" fill="#fff" opacity="0.75" transform="rotate(-8 -45 -296)"/>
    <ellipse cx="292" cy="60" rx="16" ry="4" fill="#fff" opacity="0.5" transform="rotate(78 292 60)"/>
  </g>
</svg>
